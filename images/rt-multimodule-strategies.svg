<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 675" width="1400" height="675" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Polling several modules: three strategies</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Polling several modules: three strategies</tspan></text><g class="rb-box"><rect x="40" y="130" width="416" height="96" rx="10" class="box-navy"></rect><text x="56" y="166.48" class="t-h t-white "><tspan x="56" dy="0">Poll on a timer</tspan></text><text x="56" y="193.98" class="t-small t-white"><tspan x="56" dy="0">no DRDY wiring</tspan></text></g><g class="rb-box"><rect x="40" y="226" width="416" height="296.05000000000007" rx="10" class="box"></rect><circle cx="64" cy="256.18" r="3.5" class="dot "></circle><text x="78" y="262.42" class="t-body"><tspan x="78" dy="0">master reads each module in</tspan><tspan x="78" dy="32">turn every ~100 ms</tspan></text><circle cx="64" cy="321.78" r="3.5" class="dot "></circle><text x="78" y="328.02" class="t-body"><tspan x="78" dy="0">latency: up to one window</tspan><tspan x="78" dy="32">(~100 ms)</tspan></text><circle cx="64" cy="387.38" r="3.5" class="dot "></circle><text x="78" y="393.62" class="t-body"><tspan x="78" dy="0">simplest wiring: SDA, SCL only</tspan></text></g><g class="rb-box"><rect x="492" y="130" width="416" height="96" rx="10" class="box-navy"></rect><text x="508" y="166.48" class="t-h t-white "><tspan x="508" dy="0">One DRDY line per module</tspan></text><text x="508" y="193.98" class="t-small t-white"><tspan x="508" dy="0">interrupt per module</tspan></text></g><g class="rb-box"><rect x="492" y="226" width="416" height="296.05000000000007" rx="10" class="box"></rect><circle cx="516" cy="256.18" r="3.5" class="dot "></circle><text x="530" y="262.42" class="t-body"><tspan x="530" dy="0">each module gets its own</tspan><tspan x="530" dy="32">GPIO on the master</tspan></text><circle cx="516" cy="321.78" r="3.5" class="dot "></circle><text x="530" y="328.02" class="t-body"><tspan x="530" dy="0">read right after the pulse —</tspan><tspan x="530" dy="32">latency &lt; 1 ms</tspan></text><circle cx="516" cy="387.38" r="3.5" class="dot "></circle><text x="530" y="393.62" class="t-body"><tspan x="530" dy="0">GPIO count limits the bus</tspan></text></g><g class="rb-box"><rect x="944" y="130" width="416" height="112.85000000000001" rx="10" class="box-navy"></rect><text x="960" y="166.48" class="t-h t-white "><tspan x="960" dy="0">Shared DRDY (wired-OR)</tspan></text><text x="960" y="193.98" class="t-small t-white"><tspan x="960" dy="0">open-drain lines tied together, one</tspan><tspan x="960" dy="28">pull-up</tspan></text></g><g class="rb-box"><rect x="944" y="242.85000000000002" width="416" height="279.20000000000005" rx="10" class="box"></rect><circle cx="968" cy="273.03000000000003" r="3.5" class="dot "></circle><text x="982" y="279.27000000000004" class="t-body"><tspan x="982" dy="0">one GPIO for the whole bus</tspan></text><circle cx="968" cy="306.63000000000005" r="3.5" class="dot "></circle><text x="982" y="312.87000000000006" class="t-body"><tspan x="982" dy="0">any pulse → read all modules</tspan><tspan x="982" dy="32">(latency ~1–5 ms)</tspan></text><circle cx="968" cy="372.23" r="3.5" class="dot "></circle><text x="982" y="378.47" class="t-body"><tspan x="982" dy="0">windows of different modules</tspan><tspan x="982" dy="32">are not aligned: expect a pulse</tspan><tspan x="982" dy="32">per module</tspan></text></g><g><rect x="139.52910888671875" y="464.20000000000005" width="216.9417822265625" height="35.699999999999996" rx="17.849999999999998" class="box-warn"></rect><text x="248" y="488.3500000000001" class="t-small t-warn t-bold" text-anchor="middle"><tspan x="248" dy="0">up to ~16 modules</tspan></text></g><g><rect x="595.8170874023438" y="464.20000000000005" width="208.3658251953125" height="35.699999999999996" rx="17.849999999999998" class="box-warn"></rect><text x="700" y="488.3500000000001" class="t-small t-warn t-bold" text-anchor="middle"><tspan x="700" dy="0">up to ~4 modules</tspan></text></g><g><rect x="1043.31259765625" y="464.20000000000005" width="217.37480468750002" height="35.699999999999996" rx="17.849999999999998" class="box-warn"></rect><text x="1152" y="488.3500000000001" class="t-small t-warn t-bold" text-anchor="middle"><tspan x="1152" dy="0">up to ~10 modules</tspan></text></g><g class="rb-box"><rect x="40" y="546.0500000000001" width="1320" height="88.40000000000005" rx="10" class="box-white"></rect><text x="700" y="580.7700000000001" class="t-body t-navy" text-anchor="middle"><tspan x="700" dy="0">All three: 50 kHz on ESP32 / ESP8266, 100 kHz on UNO, Mega, STM32, RP2040, Raspberry Pi; one burst read</tspan><tspan x="700" dy="32">of the atomic block per module.</tspan></text></g></svg>